<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SRS · Adaptive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">SRS<span id="brand-sub">adaptive</span></div>
    <div>
      <div class="clock" id="clock">—</div>
      <div class="save-ind" id="save-ind">saved</div>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-view="study">Study<span class="badge" id="tab-badge" style="display:none">0</span></button>
    <button class="tab" data-view="deck">Deck<span class="cnt" id="tab-cnt"></span></button>
    <button class="tab" data-view="settings">Settings</button>
  </nav>
  <div id="main"></div>
</div>
<button class="fab" id="fab" title="เพิ่มการ์ด">+</button>
<div class="backdrop" id="modal-root"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-in" accept=".json,application/json" style="display:none">
<script src="script.js"></script>
</body>
</html>
